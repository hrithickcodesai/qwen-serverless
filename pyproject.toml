[project]
name = "qwen-speech-serverless"
version = "1.0.0"
description = "serverless stt + tts endpoints on runpod (qwen3 speech models)"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub[hf_transfer,hf-xet]",
    "pydantic-settings>=2.0",
    "requests",
    "runpod",
    "ruff",
]

[project.optional-dependencies]
# host-side stt client needs mic support; container images don't use these
client = ["sounddevice", "soundfile"]

# container images install exactly one of these; qwen-asr and qwen-tts pin
# different exact versions of transformers, so they can never coexist
# stt-stream variant runs the asr model on the vllm backend, so stt needs vllm
stt = ["torch", "qwen-asr", "loguru", "vllm==0.19.1"]
tts = ["torch", "torchaudio", "qwen-tts", "loguru", "soundfile"]
# llm: vllm 0.29 targets cuda 13 (torch 2.13 from pypi) - runpod hosts run
# cuda 13 drivers (fitness checks report 13.0); qwen3.5 needs >= 0.29
llm = ["vllm==0.29.0", "loguru"]

[tool.uv]
# declare the extras mutually exclusive so the lockfile can hold all three pins
conflicts = [
    [
        { extra = "stt" },
        { extra = "tts" },
        { extra = "llm" },
    ],
]

# torch from the cu128 index (runpod driver compatible) for the stt/tts
# stacks; the llm extra needs torch 2.13 (cu13, pypi default) for vllm 0.29
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "extra != 'llm'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "extra != 'llm'" }]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
